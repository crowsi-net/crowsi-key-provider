[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-key-provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Hardware-backed signing boundary contracts for Crowsi"
license = "Apache-2.0"
readme = "README.md"
publish = false
autotests = false
repository = "https://github.com/crowsi-net/crowsi-key-provider"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22.1"
crowsi-control-contracts = { version = "=0.1.0", registry = "ecosystem-private" }
getrandom = "0.4.3"
nix = { version = "0.29.0", features = ["user"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
serde_json = "1.0.150"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[test]]
name = "contracts"
path = "tests/harnesses/contracts.rs"

[[test]]
name = "recovery"
path = "tests/harnesses/recovery.rs"
